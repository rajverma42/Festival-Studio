name: Android CI & Build

on:
  push:
    paths:
      - 'festival-studio/android-app/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'festival-studio/android-app/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    name: Build & Test Native Android App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: festival-studio/android-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: festival-studio-native-debug-apk
          path: festival-studio/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
